name: Desktop Dev

# Gated dev release channel — the installed "Nuncio Dev" app auto-updates from here.
#
# Behavior: a signed, notarized dev prerelease is published for a dev commit ONLY
# after every required check has concluded success on that exact commit:
#   - CI            (ci + e2e + real-browser smoke)
#   - Desktop Smoke (packaged app boots and renders)
# The publish never fires on a red or still-running commit, and each commit ships at
# most once.
#
# Mechanism: this workflow is chained off the required workflows with `workflow_run`.
# Each time a required workflow finishes on dev, the gate re-checks the conclusion of
# every required workflow at that commit. Whichever check finishes last is the first
# trigger to see all-green, so it publishes — there is no "who finished last" timestamp
# compare that could tie and drop the publish. A commit that already shipped a dev
# release is skipped, so re-running CI/smoke on a shipped commit is a no-op. Re-running
# a failed CI to green re-fires the chain and publishes. The decision is a unit-tested
# script (scripts/desktop-dev-gate.mjs), not inline bash.
#
# Signing secrets stay isolated in the reusable build workflow — the gate only reads
# check conclusions and releases with the default token, and only the build job touches
# the certs.
#
# Note: `workflow_run` triggers are registered from the repository default branch, so
# this file must live on that branch for the chain to fire.

on:
  workflow_run:
    workflows: [CI, Desktop Smoke]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only dev-branch push runs gate a publish; skip PR runs. Manual dispatch forces one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev')
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether every required check passed on this commit
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: node scripts/desktop-dev-gate.mjs

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    # Serialize ONLY the publish, never the gate — every gate evaluation must run so a
    # later event can't drop the last green commit. `false` never cancels an in-flight
    # sign/notarize/publish, and one-at-a-time keeps the reusable build's stale-draft
    # sweep from racing a parallel build.
    concurrency:
      group: desktop-dev-publish
      cancel-in-progress: false
    uses: ./.github/workflows/desktop-build.yml
    with:
      channel: dev
      ref: ${{ needs.gate.outputs.sha }}
    secrets: inherit
