name: Desktop Dev

# Gated dev release channel — the installed "Nuncio Dev" app auto-updates from here.
#
# Behavior: a signed, notarized dev prerelease is published for a dev commit ONLY
# after every required check has concluded success on that exact commit:
#   - CI            (ci + e2e + real-browser smoke)
#   - Desktop Smoke (packaged app boots and renders)
# The publish never fires on a red or still-running commit, and each commit ships at
# most once.
#
# Triggers:
#   - `push` to `dev` — primary path. The gate job polls until CI + Desktop Smoke
#     conclude (or fail), then publishes. This works from the workflow file on `dev`
#     itself (push events use the workflow at the pushed commit).
#   - `workflow_run` after CI / Desktop Smoke — secondary path once this file also
#     lives on the repository default branch (`main`). GitHub only registers
#     `workflow_run` triggers from the default branch; until the next promotion
#     syncs this file to `main`, rely on the `push` path above.
#   - `workflow_dispatch` — manual force publish of the selected ref.
#
# Guards (scripts/desktop-dev-gate.mjs):
#   - never drop the last green commit: publish on any all-green, unshipped commit
#   - exactly once: skip a commit that already has a dev release (draft or published)
#   - never go backward: refuse a commit behind the last shipped dev commit
#
# Signing secrets stay isolated in the reusable build workflow — the gate only reads
# check conclusions and releases with the default token, and only the build job touches
# the certs.

on:
  push:
    branches: [dev]
  workflow_run:
    workflows: [CI, Desktop Smoke]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    # Push path waits for CI (~7m) + Desktop Smoke (~1m); keep headroom for queueing.
    timeout-minutes: 25
    # Only dev-branch push / chained runs gate a publish; skip PR-triggered smoke.
    # Manual dispatch forces one.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev')
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether every required check passed on this commit
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: node scripts/desktop-dev-gate.mjs

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    # Serialize ONLY the publish, never the gate — every gate evaluation must run so a
    # later event can't drop the last green commit. `false` never cancels an in-flight
    # sign/notarize/publish, and one-at-a-time keeps the reusable build's stale-draft
    # sweep from racing a parallel build.
    concurrency:
      group: desktop-dev-publish
      cancel-in-progress: false
    uses: ./.github/workflows/desktop-build.yml
    with:
      channel: dev
      ref: ${{ needs.gate.outputs.sha }}
    secrets: inherit
