name: Desktop Stable

# Manual retry for a stable desktop build. The normal release path calls the
# reusable build directly while the GitHub Release is still a draft, then the
# build publishes it only after the updater manifest and signed assets exist.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stable:
    uses: ./.github/workflows/desktop-build.yml
    with:
      channel: stable
    secrets: inherit
