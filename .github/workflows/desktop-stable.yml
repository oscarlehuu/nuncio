name: Desktop Stable

# When a stable GitHub Release is published (the `v x.y.z` release cut by the
# Changesets release workflow on main), build the signed + notarized stable app
# and attach its .dmg/.zip + updater manifest so "Nuncio" auto-updates.
# Skips prereleases (those are the dev channel, handled by desktop-dev).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  stable:
    if: ${{ !github.event.release.prerelease }}
    uses: ./.github/workflows/desktop-build.yml
    with:
      channel: stable
    secrets: inherit
