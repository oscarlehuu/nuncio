name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Crew verifier sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /usr/bin/bwrap --die-with-parent --unshare-all --new-session --ro-bind / / /usr/bin/true

      - name: Install dependencies
        run: bun install

      - name: Build (server + web)
        run: bun run build

      - name: Lint + typecheck (server, web, core, mobile)
        run: bun run lint

      - name: Unit tests + coverage (server)
        run: bun run --filter @nuncio/server test:coverage

      - name: Unit tests (core, mobile)
        run: bun run --filter @nuncio/core test && bun run --filter @nuncio/mobile test

      - name: Unit tests (desktop, landing)
        run: bun run --filter @nuncio/desktop test && bun run --filter @nuncio/landing test

      - name: Web unit tests + coverage
        run: bun run --filter @nuncio/web test:coverage

      - name: Script unit tests
        run: bun run test:scripts

      - name: Dead-code gate (knip vs committed baseline)
        run: bun run check-dead-code

      - name: Coverage ratchet (line coverage may only go up)
        run: bun run check-coverage-ratchet

      - name: Require changeset for user-facing PR changes
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.title, 'chore: release version')
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run check-changeset

  e2e-smoke:
    name: e2e + smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Crew verifier sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          /usr/bin/bwrap --die-with-parent --unshare-all --new-session --ro-bind / / /usr/bin/true

      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: bun install

      - name: Server e2e tests
        run: bun run --filter @nuncio/server test:e2e

      - name: Real-browser smoke
        env:
          NUNCIO_SMOKE_CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bun run test:smoke-ui --build

      - name: UI perf measurement (median of samples; reuses the smoke's web build)
        env:
          NUNCIO_SMOKE_CHROME_EXECUTABLE: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: bun run perf:ui

      - name: Perf ratchet (UI smoothness budgets; report-only until a CI baseline is committed)
        run: bun run check-perf-ratchet

      - name: Upload smoke artifacts (screenshots + trace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 14
