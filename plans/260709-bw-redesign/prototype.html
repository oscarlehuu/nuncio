<title>Nuncio — B&W redesign prototype</title>
<style>
  /* ————————————————————————————————————————————————————————————————
     Nuncio B&W — Vercel-discipline monochrome. Two rules:
       1. Luminance builds the hierarchy (sidebar < content < card).
       2. Color exists only when something needs the founder:
          amber = waiting on you, red = broken. Everything else is ink.
     No glass, no aurora, no blur. Floating layers are solid + shadow.
     ———————————————————————————————————————————————————————————————— */
  .nuncio, .nuncio * { box-sizing: border-box; margin: 0; padding: 0; }
  .nuncio {
    --bg: #0a0a0a; --side: #050505; --card: #111214; --card2: #17181a;
    --well: #101113;
    --hair: rgba(255,255,255,.085); --hair2: rgba(255,255,255,.16);
    --fg: #ededed; --mut: #8f8f8f; --mut2: #5b5b5b;
    --pri: #ededed; --pri-fg: #0a0a0a;
    --amber: #f5a623; --amber-dim: rgba(245,166,35,.14);
    --red: #ef5f66; --red-dim: rgba(229,72,77,.14);
    --grn: #56b366; --grn-txt: #56b366;
    --sh1: 0 1px 2px rgba(0,0,0,.4);
    --sh2: 0 4px 14px rgba(0,0,0,.45), 0 1px 3px rgba(0,0,0,.5);
    --sh3: 0 12px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.5);
    --r: 8px; --r-lg: 12px;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; line-height: 1.5; color: var(--fg); background: var(--bg);
    position: fixed; inset: 0; display: flex; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .nuncio.lt {
    --bg: #ffffff; --side: #fafafa; --card: #ffffff; --card2: #fafafa;
    --well: #f7f7f7;
    --hair: rgba(0,0,0,.09); --hair2: rgba(0,0,0,.18);
    --fg: #171717; --mut: #6f6f6f; --mut2: #ababab;
    --pri: #171717; --pri-fg: #ffffff;
    --amber: #b3730d; --amber-dim: rgba(179,115,13,.10);
    --red: #ca2a30; --red-dim: rgba(202,42,48,.08);
    --grn: #1a7f37; --grn-txt: #1a7f37;
    --sh1: 0 1px 2px rgba(0,0,0,.05);
    --sh2: 0 4px 14px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05);
    --sh3: 0 12px 40px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
  }
  .nuncio ::-webkit-scrollbar { width: 8px; height: 8px; }
  .nuncio ::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 4px; }
  .nuncio button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
  .nuncio input, .nuncio textarea { font: inherit; color: var(--fg); }
  .nuncio svg { display: block; flex-shrink: 0; }
  .nuncio kbd {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 10px;
    border: 1px solid var(--hair); border-radius: 4px; padding: 0 4px; color: var(--mut);
  }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* — buttons: exactly three voices — */
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border-radius: var(--r); font-size: 12.5px; font-weight: 500; white-space: nowrap;
    transition: background .12s, border-color .12s, opacity .12s, transform .06s; }
  .btn:active { transform: scale(.98); }
  .btn.pri { background: var(--pri); color: var(--pri-fg); }
  .btn.pri:hover { opacity: .88; }
  .btn.out { border: 1px solid var(--hair2); background: transparent; }
  .btn.out:hover { background: var(--hover, rgba(128,128,128,.09)); }
  .btn.gho { color: var(--mut); }
  .btn.gho:hover { color: var(--fg); background: rgba(128,128,128,.10); }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { background: var(--red-dim); }
  .btn.icon { width: 28px; padding: 0; justify-content: center; }
  .btn[disabled] { opacity: .38; pointer-events: none; }
  .btn.round { border-radius: 999px; }

  /* — shell — */
  .rail { position: fixed; left: 0; top: 0; bottom: 0; z-index: 60; width: 52px;
    display: flex; flex-direction: column; transition: width .18s ease; }
  .rail.open { width: 260px; background: var(--side); border-right: 1px solid var(--hair); box-shadow: var(--sh3); }
  .rail .burger { margin: 10px; }
  .rail .fly { flex: 1; min-height: 0; opacity: 0; pointer-events: none; transform: translateX(-6px);
    transition: opacity .14s ease, transform .14s ease; border-top: 1px solid var(--hair); }
  .rail.open .fly { opacity: 1; pointer-events: auto; transform: none; }
  .shell-side { width: 260px; flex-shrink: 0; background: var(--side); border-right: 1px solid var(--hair);
    display: flex; flex-direction: column; }
  .shell-side .top { padding: 10px; border-bottom: 1px solid var(--hair); }
  main.view { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 0; animation: fadein .16s ease; }
  @keyframes fadein { from { opacity: 0; } }

  /* — sidebar internals — */
  .sb { display: flex; flex-direction: column; height: 100%; width: 260px; background: var(--side); font-size: 12.5px; }
  .sb .brand { padding: 14px 14px 4px; font-weight: 600; letter-spacing: .01em; color: var(--mut); }
  .sb nav { padding: 8px 8px 0; display: flex; flex-direction: column; gap: 1px; }
  .sb nav .it { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r);
    color: var(--fg); font-size: 13px; transition: background .1s; text-align: left; width: 100%; }
  .sb nav .it:hover { background: rgba(128,128,128,.10); }
  .sb nav .it.on { background: rgba(128,128,128,.14); font-weight: 500; }
  .sb nav .it svg { color: var(--mut); }
  .sb .badge { margin-left: auto; min-width: 18px; text-align: center; border-radius: 999px;
    background: var(--amber-dim); color: var(--amber); font-size: 10.5px; font-weight: 600; padding: 1px 6px; }
  .sb .tabs { display: flex; gap: 2px; padding: 10px 12px 4px; }
  .sb .tabs button { padding: 3px 8px; border-radius: 6px; color: var(--mut); font-size: 12.5px; }
  .sb .tabs button.on { background: rgba(128,128,128,.14); color: var(--fg); font-weight: 500; }
  .sb .tabs .n { color: var(--mut2); font-size: 10.5px; margin-left: 4px; }
  .sb .list { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
  .sb .grouphead { display: flex; align-items: center; justify-content: space-between;
    padding: 10px 8px 4px; color: var(--mut); font-size: 11px; }
  .sb .ghd-btn { display: inline-flex; align-items: center; gap: 3px; color: var(--mut); font-size: 11px;
    border-radius: 5px; padding: 1px 5px; }
  .sb .ghd-btn:hover { background: rgba(128,128,128,.12); color: var(--fg); }
  .sb .grp { display: flex; align-items: center; gap: 6px; width: 100%; padding: 5px 8px; border-radius: var(--r);
    color: var(--fg); font-size: 12.5px; font-weight: 500; }
  .sb .grp:hover { background: rgba(128,128,128,.08); }
  .sb .grp svg { color: var(--mut); }
  .sb .grp .n { margin-left: auto; color: var(--mut2); font-weight: 400; }
  .sb .row { position: relative; display: block; width: 100%; text-align: left; padding: 5px 8px 6px;
    border-radius: var(--r); transition: background .1s; }
  .sb .row:hover { background: rgba(128,128,128,.09); }
  .sb .row.on { background: rgba(128,128,128,.14); }
  .sb .row .l1 { display: flex; align-items: center; gap: 6px; }
  .sb .row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
  .sb .row .ago { color: var(--mut2); font-size: 10.5px; }
  .sb .row .l2 { display: flex; align-items: center; gap: 5px; margin-top: 1px; color: var(--mut);
    font-size: 11px; overflow: hidden; white-space: nowrap; }
  .sb .row .l2 .pv { overflow: hidden; text-overflow: ellipsis; }
  .sb .row .hact { position: absolute; right: 5px; top: 5px; display: none; }
  .sb .row:hover .hact { display: flex; gap: 2px; }
  .sb .hact .btn { background: var(--side); box-shadow: var(--sh1); }
  .sb footer { border-top: 1px solid var(--hair); padding: 8px 10px; display: flex; justify-content: flex-end; gap: 2px; }
  .sb .search { position: relative; margin: 6px 12px 2px; }
  .sb .search svg { position: absolute; left: 8px; top: 7px; color: var(--mut2); }
  .sb .search input { width: 100%; height: 28px; padding: 0 8px 0 26px; border-radius: var(--r);
    border: 1px solid var(--hair); background: transparent; font-size: 12px; outline: none; }
  .sb .search input:focus { border-color: var(--hair2); }

  /* — status dots: gray is a state, color is a summons — */
  .dot { width: 7px; height: 7px; border-radius: 999px; flex-shrink: 0; }
  .dot.run { background: var(--mut); animation: pulse 2.2s ease-in-out infinite; }
  .dot.err { background: var(--red); }
  .dot.wait { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
  .dot.ok { background: var(--mut2); }
  @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

  /* — page chrome — */
  .phead { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--hair);
    background: var(--bg); flex-shrink: 0; min-height: 49px; }
  .phead h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .phead .sp { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .pbody { flex: 1; overflow-y: auto; min-height: 0; }
  .center-col { max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }
  .rail-pad { padding-left: 60px; }

  /* — cards — */
  .card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--r-lg); box-shadow: var(--sh1); }
  .card.hov { transition: box-shadow .15s, border-color .15s; }
  .card.hov:hover { box-shadow: var(--sh2); border-color: var(--hair2); }

  /* — composer — */
  .ctx-row { display: flex; align-items: center; justify-content: center; gap: 4px; margin-bottom: 10px;
    color: var(--mut); font-size: 12.5px; }
  .ctx-row .tpick { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; color: var(--mut); }
  .ctx-row .tpick:hover { color: var(--fg); background: rgba(128,128,128,.09); }
  .ctx-row .sep { color: var(--mut2); }
  .composer { background: var(--card); border: 1px solid var(--hair); border-radius: 14px; box-shadow: var(--sh2); }
  .composer:focus-within { border-color: var(--hair2); }
  .composer textarea { width: 100%; min-height: 96px; resize: none; border: 0; outline: none; background: transparent;
    padding: 16px 18px 6px; font-size: 14px; }
  .composer textarea::placeholder { color: var(--mut2); }
  .composer .bar { display: flex; align-items: center; gap: 6px; padding: 6px 12px 12px; }
  .composer .bar .grow { flex: 1; }
  .send { width: 30px; height: 30px; border-radius: 999px; background: var(--pri); color: var(--pri-fg);
    display: inline-flex; align-items: center; justify-content: center; transition: opacity .12s, transform .06s; }
  .send:hover { opacity: .88; } .send:active { transform: scale(.94); }
  .send[disabled] { opacity: .35; }
  .pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--hair); border-radius: 999px;
    padding: 5px 12px; color: var(--mut); font-size: 12px; transition: all .13s; }
  .pill:hover { color: var(--fg); border-color: var(--hair2); transform: translateY(-1px); }

  /* — attention queue — */
  .q-item { position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px;
    overflow: hidden; }
  .q-item .stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .stripe.amber { background: var(--amber); } .stripe.quiet { background: var(--hair2); }
  .chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px;
    font-size: 11px; font-weight: 500; border: 1px solid var(--hair2); color: var(--mut); }
  .chip.amber { border-color: transparent; background: var(--amber-dim); color: var(--amber); }
  .q-item .body { flex: 1; min-width: 0; }
  .q-item .title { font-size: 13px; font-weight: 500; margin-top: 5px; }
  .q-item .meta { color: var(--mut); font-size: 11.5px; margin-top: 1px; }
  .q-item .acts { display: flex; gap: 6px; flex-shrink: 0; }
  .digest-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px; width: 100%; text-align: left; }
  .digest-link .ic { width: 34px; height: 34px; border-radius: 9px; background: var(--well);
    display: grid; place-items: center; color: var(--mut); border: 1px solid var(--hair); }
  .digest-link .arrow { color: var(--mut); transition: transform .13s; }
  .digest-link:hover .arrow { transform: translateX(2px); }
  .sect-label { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--mut); margin: 26px 0 10px; }

  /* — transcript — */
  .msg-user { display: flex; justify-content: flex-end; margin: 14px 0; }
  .msg-user .bub { max-width: 78%; background: var(--card2); border: 1px solid var(--hair);
    border-radius: 12px; padding: 8px 13px; font-size: 13.5px; }
  .msg-ai { display: flex; gap: 10px; margin: 14px 0; font-size: 13.5px; }
  .msg-ai .av { width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--hair);
    display: grid; place-items: center; font-size: 10px; font-weight: 600; color: var(--mut); flex-shrink: 0; margin-top: 1px; }
  .msg-ai .txt { min-width: 0; }
  .tool-row { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 32px; color: var(--mut); font-size: 12.5px; }
  .tool-row svg { color: var(--mut2); }
  .tool-row .tgt { color: var(--fg); opacity: .85; }
  .tool-row .n { color: var(--mut2); font-size: 11.5px; }
  .tool-out { margin: 4px 0 4px 32px; background: var(--well); border: 1px solid var(--hair); border-radius: var(--r);
    padding: 8px 12px; font-size: 11.5px; color: var(--mut); max-width: 620px; }
  .vchip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--hair2); border-radius: 999px;
    padding: 0 8px; height: 20px; font-size: 11px; color: var(--mut); }

  /* — session view — */
  .sess-head { display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--hair);
    background: var(--bg); min-height: 49px; flex-shrink: 0; position: relative; }
  .sess-head .title-wrap { flex: 1; display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; }
  .sess-head .title { font-size: 13px; font-weight: 500; max-width: 46%; overflow: hidden; white-space: nowrap;
    text-overflow: ellipsis; padding: 2px 6px; border-radius: 6px; }
  .sess-head .title:hover { background: rgba(128,128,128,.09); }
  .sess-head .right { position: absolute; right: 12px; display: flex; gap: 2px; }
  .sess-body { flex: 1; min-height: 0; display: flex; }
  .sess-scroll { flex: 1; overflow-y: auto; padding: 4px 28px; }
  .sess-inner { max-width: 740px; margin: 0 auto; }
  .steer-wrap { flex-shrink: 0; padding: 8px 20px 14px; }
  .steer { max-width: 740px; margin: 0 auto; background: var(--card); border: 1px solid var(--hair);
    border-radius: 14px; box-shadow: var(--sh2); }
  .steer:focus-within { border-color: var(--hair2); }
  .steer textarea { width: 100%; min-height: 42px; resize: none; border: 0; outline: none; background: transparent;
    padding: 11px 14px 2px; font-size: 13px; }
  .steer .bar { display: flex; align-items: center; gap: 10px; padding: 4px 10px 8px; color: var(--mut); font-size: 12px; }
  .steer .foot { display: flex; gap: 14px; padding: 6px 14px; border-top: 1px solid var(--hair); color: var(--mut); font-size: 11px; align-items: center; }
  .pending-banner { max-width: 740px; margin: 0 auto 8px; border: 1px solid var(--hair); border-left: 3px solid var(--amber);
    background: var(--card); border-radius: var(--r-lg); padding: 10px 14px; box-shadow: var(--sh1); }
  .panel { width: 340px; flex-shrink: 0; border-left: 1px solid var(--hair); display: flex; flex-direction: column; background: var(--side); }
  .panel .phead2 { display: flex; align-items: center; gap: 2px; padding: 6px 8px; border-bottom: 1px solid var(--hair); }
  .panel .phead2 .name { margin-left: 6px; font-size: 12.5px; font-weight: 500; }
  .panel .pcontent { flex: 1; overflow-y: auto; padding: 10px; font-size: 12.5px; }
  .filerow { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; }
  .filerow:hover { background: rgba(128,128,128,.08); }
  .filerow .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plus { color: var(--grn-txt); } .minus { color: var(--red); }
  .term { background: #050505; border-radius: var(--r); padding: 10px 12px; color: #bbb; font-size: 11.5px; min-height: 120px; }
  .lt .term { background: #171717; }

  /* — workbench — */
  .wb-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--hair); min-height: 45px; flex-shrink: 0; }
  .wb-head h1 { font-size: 14px; font-weight: 600; }
  .seg { margin-left: auto; display: flex; gap: 2px; background: var(--well); border: 1px solid var(--hair);
    border-radius: 9px; padding: 2px; }
  .seg button { padding: 2px 9px; border-radius: 7px; font-size: 11.5px; color: var(--mut); font-weight: 500; }
  .seg button.on { background: var(--card); color: var(--fg); box-shadow: var(--sh1); }
  .wb-grid { flex: 1; min-height: 0; display: grid; gap: 10px; padding: 10px; }
  .tile { display: flex; flex-direction: column; min-height: 0; background: var(--card); border: 1px solid var(--hair);
    border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sh1); transition: box-shadow .15s, border-color .15s, transform .15s; position: relative; }
  .tile:hover { box-shadow: var(--sh2); transform: translateY(-1px); }
  .tile.focus { border-color: var(--hair2); box-shadow: 0 0 0 1px var(--hair2), var(--sh2); }
  .tile.wait { border-color: var(--amber); }
  .tile.wait::after { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 22px -6px var(--amber); animation: pulse 1.9s ease-in-out infinite; }
  .tile.err { border-color: var(--red); }
  .tile .thead { display: flex; align-items: center; gap: 7px; padding: 8px 10px; border-bottom: 1px solid var(--hair); flex-shrink: 0; }
  .tile .thead .tt { font-size: 12.5px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tile .thead .ts { font-size: 10.5px; color: var(--mut); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tile .thead .hb { display: none; margin-left: auto; gap: 2px; }
  .tile:hover .thead .hb { display: flex; }
  .tile .tbody { flex: 1; overflow-y: auto; padding: 6px 12px; font-size: 12px; color: var(--mut); }
  .tile .tfoot { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--hair); flex-shrink: 0; }
  .tile .tfoot input { flex: 1; height: 28px; border: 1px solid var(--hair); background: transparent; border-radius: var(--r);
    padding: 0 10px; font-size: 12px; outline: none; }
  .tile .tfoot input:focus { border-color: var(--hair2); }
  .tile.empty { align-items: stretch; justify-content: stretch; }
  .tile.empty textarea { flex: 1; resize: none; border: 0; background: transparent; outline: none; padding: 12px; font-size: 12.5px; }
  .tile.empty .ebar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-top: 1px solid var(--hair); color: var(--mut); font-size: 11.5px; }

  /* — settings — */
  .set-wrap { flex: 1; min-height: 0; display: flex; }
  .set-nav { width: 210px; flex-shrink: 0; border-right: 1px solid var(--hair); padding: 10px; overflow-y: auto; background: var(--side); }
  .set-nav .it { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 9px;
    border-radius: var(--r); color: var(--mut); font-size: 12.5px; }
  .set-nav .it svg { color: var(--mut2); }
  .set-nav .it:hover { color: var(--fg); background: rgba(128,128,128,.08); }
  .set-nav .it.on { color: var(--fg); background: rgba(128,128,128,.13); font-weight: 500; }
  .set-nav .search svg { position: absolute; left: 8px; top: 8px; color: var(--mut2); }
  .set-body { flex: 1; overflow-y: auto; padding: 22px 26px 60px; }
  .set-sec { max-width: 640px; }
  .set-row { display: flex; align-items: center; gap: 16px; padding: 13px 2px; border-bottom: 1px solid var(--hair); }
  .set-row .info { flex: 1; min-width: 0; }
  .set-row .lb { font-size: 13px; font-weight: 500; }
  .set-row .ds { font-size: 11.5px; color: var(--mut); margin-top: 1px; }
  .theme-cards { display: flex; gap: 10px; }
  .tcard { border: 1px solid var(--hair); border-radius: 10px; padding: 5px; width: 120px; }
  .tcard.on { border-color: var(--fg); }
  .tcard .prev { height: 56px; border-radius: 6px; border: 1px solid var(--hair); overflow: hidden; display: flex; }
  .tcard .cap { font-size: 11px; color: var(--mut); text-align: center; padding-top: 5px; }
  .tcard.on .cap { color: var(--fg); font-weight: 500; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--hair); border-radius: var(--r); overflow: hidden; }
  .stepper button { width: 26px; height: 26px; color: var(--mut); } .stepper button:hover { background: rgba(128,128,128,.1); color: var(--fg); }

function gridHtml() {
  const presets = { '1x1': [1,1], '2x1': [2,1], '2x2': [2,2], '3x2': [3,2] };
  const [cols, rows] = presets[store.preset];
  const count = cols * rows;
  const tiles = [];
  for (let i = 0; i < count; i++) {
    const s = S(store.gridBound[i]);
    if (s) {
      const cls = s.status === 'WAIT' ? 'wait' : s.status === 'ERROR' ? 'err' : '';
      tiles.push(`
      <div class="tile ${cls} ${store.focus === i ? 'focus' : ''}" data-act="tfocus" data-v="${i}" role="button" tabindex="0" aria-label="Session ${s.title}">
        <div class="thead">
          ${dot(s.status)}
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:6px"><span class="tt">${s.title}</span></div>
            <div class="ts">${s.status === 'WAIT' ? '<span style="color:var(--amber)">Waiting for you</span>' : `${s.repo ?? 'Chat'} · ${s.model} · ${statusText[s.status]}`}</div>
          </div>
          <div class="hb">
            <button class="btn gho icon" data-act="tmax" data-id="${s.id}" aria-label="Maximize">${ic.max}</button>
            <button class="btn gho icon" data-act="slot-free" data-v="${i}" aria-label="Unbind slot">${ic.x}</button>
          </div>
        </div>
        <div class="tbody">
          ${s.id === 's1' ? `<div class="tool-row" style="padding-left:0">${ic.term}<span>Ran</span><span class="tgt mono" style="font-size:11px">bun test apps/desktop</span></div>
          <p style="margin-top:6px">Retries now go through an injected scheduler; re-running the suite 25×…</p>` :
            s.id === 's2' ? `<p>One thing I can't decide from the code: which port should the guide document for the pairing server?</p>` :
            `<p>Left 4 comments on PR #87 — one blocking note on the dedup seam, rest are nits.</p>`}
        </div>
        <div class="tfoot">
          <input placeholder="Steer this agent…" aria-label="Steer ${s.title}">
          <button class="btn pri icon" data-act="toast" data-v="Steer sent" aria-label="Send">${ic.send}</button>
        </div>
      </div>`);
    } else {
      tiles.push(`
      <div class="tile empty">
        <textarea placeholder="Delegate a task to a new agent…" aria-label="New agent prompt" data-slot-prompt="${i}"></textarea>
        <div class="ebar">
          <button class="btn gho" data-menu="repo" style="font-weight:400;height:24px">${ic.folder} nuncio ${ic.chevD}</button>
          <button class="btn gho" data-menu="model" style="font-weight:400;height:24px">${modelTriggerHtml()} ${ic.chevD}</button>
          <div style="flex:1"></div>
          <button class="btn gho" data-menu="attach" data-id="${i}" style="height:24px">Attach ${ic.chevD}</button>
          <button class="send" style="width:26px;height:26px" data-act="slot-start" data-v="${i}" aria-label="Start">${ic.arrowUp}</button>
        </div>
      </div>`);
    }
  }
  return `
  <div class="wb-head ${store.pinned ? '' : 'rail-pad'}">
    <h1>Workbench</h1>
    <div class="seg" role="tablist" aria-label="Grid layout">
      ${Object.keys(presets).map(p => `<button role="tab" aria-selected="${store.preset === p}" class="${store.preset === p ? 'on' : ''} tnum" data-act="preset" data-v="${p}">${p}</button>`).join('')}
    </div>
  </div>
  <div class="wb-grid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rows},minmax(0,1fr))">
    ${tiles.join('')}
  </div>`;
}

function render() {
  try { renderInner(); } catch (err) { console.error('render failed:', err); }
}
function renderInner() {
  const el = $('#nc');
  el.className = 'nuncio' + (store.theme === 'light' ? ' lt' : '');
  el.innerHTML = `
    ${store.pinned ? `
      <aside class="shell-side">
        <div class="top"><button class="btn out icon" data-act="pin" aria-label="Unpin sidebar">${ic.menu}</button></div>
        <div style="flex:1;min-height:0">${sidebarHtml()}</div>
      </aside>` : `
      <div class="rail ${store.railOpen ? 'open' : ''}" id="rail">
        <button class="btn out icon burger" data-act="pin" aria-label="Pin sidebar" style="background:var(--bg)">${ic.menu}</button>
        <div class="fly">${sidebarHtml()}</div>
      </div>`}
    <main class="view">${viewHtml()}</main>
    ${menuHtml()}
    ${dialogHtml()}
    <div class="toasts">${store.toasts.map(t => `<div class="toast">${ic.check}${t.msg}</div>`).join('')}</div>
  `;
  if (!store.pinned) {
    // Toggle the class in place — re-rendering on hover would swap the DOM out
    // from under the user's click.
    const rail = $('#rail');
    rail.addEventListener('mouseenter', () => { store.railOpen = true; rail.classList.add('open'); });
    rail.addEventListener('mouseleave', () => { store.railOpen = false; rail.classList.remove('open'); });
  }
}

/* ————— events (delegated) ————— */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-menu],[data-stop]');
  if (!t) {
    // Clicks inside an open menu (e.g. the model search field) keep it open.
    if (store.menu && !e.target.closest('.menu')) { store.menu = null; render(); }
    return;
  }
  if (t.dataset.stop !== undefined && !t.dataset.act) return;

  if (t.dataset.go !== undefined) { go(t.dataset.go); return; }

  if (t.dataset.menu) {
    const r = t.getBoundingClientRect();
    const kind = t.dataset.menu;
    store.menu = store.menu?.kind === kind ? null
      : { kind, x: Math.min(r.left, innerWidth - (kind === 'model' ? 280 : 230)), y: r.bottom + 6, id: t.dataset.id };
    if (store.menu?.kind === 'model') { store.modelQ = ''; store.modelExpand = {}; }
    render();
    if (store.menu?.kind === 'model') requestAnimationFrame(() => $('#modelSearch')?.focus());
    return;
  }

  const act = t.dataset.act, v = t.dataset.v, id = t.dataset.id;
  const closeMenu = () => { store.menu = null; };
  switch (act) {
    case 'theme': store.theme = store.theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('bw-theme', store.theme); break;
    case 'pin': store.pinned = !store.pinned; store.railOpen = false; localStorage.setItem('bw-pin', store.pinned ? '1' : '0'); break;
    case 'sbtab': store.sbTab = v; break;
    case 'groupby': store.groupBy = v; closeMenu(); break;
    case 'preset': store.preset = v; store.focus = 0; break;
    case 'tfocus': store.focus = Number(v); break;
    case 'tmax': go('/session/' + id + '?from=grid'); return;
    case 'panel': store.panel = !store.panel; break;
    case 'tool': store.tool = v; break;
    case 'setsec': store.setSec = v; break;
    case 'prtab': store.prTab = v; break;
    case 'qexpand': { const it = store.queue.find(q => q.id === id); it.open = !it.open; break; }
    case 'approve': store.queue = store.queue.filter(q => q.id !== id); toast('3 tasks queued'); return;
    case 'dismiss': store.queue = store.queue.filter(q => q.id !== id); toast('Dismissed'); return;
    case 'answer': { S('s2').status = 'RUNNING'; S('s2').preview = 'Writing the pairing guide'; toast('Answer sent — agent resumed'); go('/session/s2'); return; }
    case 'archive': toast('Session archived'); closeMenu(); break;
    case 'restore': toast('Session restored'); break;
    case 'loop-new': store.dialog = 'loop'; closeMenu(); break;
    case 'loop-create': {
      const g = $('#loopGoal')?.value.trim();
      const name = g ? g.toLowerCase().split(/\s+/).slice(0, 3).join('-').replace(/[^a-z0-9-]/g, '') : 'new-loop';
      store.loops.push({ id: 'l' + Date.now(), name, sub: `${$('#loopSched').value} · max ${$('#loopMax').value}/day · never run`, state: 'active' });
      store.dialog = null; toast('Loop created'); break;
    }
    case 'loop-toggle': {
      const l = store.loops.find(x => x.id === id);
      l.state = l.state === 'active' ? 'paused' : 'active';
      toast(l.state === 'active' ? 'Loop resumed' : 'Loop paused'); break;
    }
    case 'loop-del': store.loops = store.loops.filter(x => x.id !== v); store.menu = null; toast('Loop deleted'); break;
    case 'ask-delete': store.dialog = 'delete'; closeMenu(); break;
    case 'dclose': store.dialog = null; break;
    case 'dconfirm': store.dialog = null; toast('Session deleted'); break;
    case 'create': {
      const ta = $('#heroPrompt');
      const prompt = ta?.value.trim();
      if (!prompt) { ta?.focus(); return; }
      const ns = { id: 's' + Date.now(), title: prompt.length > 42 ? prompt.slice(0, 42) + '…' : prompt,
        repo: 'nuncio', branch: 'dev', provider: 'C', model: 'Fable 5',
        status: 'RUNNING', ago: 'now', preview: 'Scouting the repo…', ctx: '2%', prompt };
      sessions.unshift(ns);
      toast('Agent started');
      go('/session/' + ns.id); return;
    }
    case 'slot-start': {
      const i = Number(v);
      const ta = document.querySelector(`[data-slot-prompt="${i}"]`);
      const prompt = ta?.value.trim();
      if (!prompt) { ta?.focus(); return; }
      const ns = { id: 's' + Date.now(), title: prompt.length > 42 ? prompt.slice(0, 42) + '…' : prompt,
        repo: 'nuncio', branch: 'dev', provider: 'C', model: 'Fable 5',
        status: 'RUNNING', ago: 'now', preview: 'Scouting the repo…', ctx: '2%', prompt };
      sessions.unshift(ns);
      store.gridBound[i] = ns.id;
      toast('Agent started'); break;
    }
    case 'slot-free': store.gridBound[Number(v)] = null; toast('Slot freed'); break;
    case 'slot-bind': {
      const slot = Number(store.menu?.id ?? -1);
      if (slot >= 0) store.gridBound[slot] = v;
      store.menu = null; break;
    }
    case 'starter': { const ta = $('#heroPrompt'); if (ta) { ta.value = v; ta.focus(); } return; }
    case 'handoff': toast('QR handoff would open'); closeMenu(); break;
    case 'model-set': {
      store.model = v;
      store.recentModels = [v, ...store.recentModels.filter(m => m !== v)].slice(0, 3);
      const def = findModel(v);
      store.modelOpts = { effort: defaultEffort(def), fast: false };
      closeMenu(); break;
    }
    case 'model-more': {
      store.modelExpand[v] = true;
      const list = $('#modelList');
      if (list) { list.innerHTML = modelListHtml(); return; }
      break;
    }
    case 'model-cli': store.modelCli = v; break;
    case 'opt-effort': store.modelOpts.effort = v; break;
    case 'opt-fast': store.modelOpts.fast = !store.modelOpts.fast; break;
    case 'toast': toast(v); closeMenu(); break;
  }
  render();
});
// Model search filters in place — swap only the list so the input keeps focus.
document.addEventListener('input', e => {
  if (e.target.id !== 'modelSearch') return;
  store.modelQ = e.target.value;
  const list = $('#modelList');
  if (list) list.innerHTML = modelListHtml();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (store.menu || store.dialog)) { store.menu = null; store.dialog = null; render(); }
});

render();
</script>
